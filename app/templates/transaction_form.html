{% extends 'base.html' %}{% block content %}<h1 class="text-3xl font-bold">Add {{typ.title()}}</h1><p class="text-slate-500 mb-6">Enter the details; totals are calculated automatically.</p><form method="post" class="bg-white border rounded-xl p-6" id="f"><div class="grid md:grid-cols-3 gap-4 mb-5"><label>Date<input required type="date" name="date" value="{{today if today else ''}}" class="input"></label><label>{{'Customer' if typ=='income' else 'Supplier'}}<select name="person_id" class="input"><option value="">Walk-in / not selected</option>{% for p in people %}<option value="{{p.id}}">{{p.name}}</option>{% endfor %}</select></label><label>Payment method<select name="payment_method" class="input">{% for p in payments %}<option>{{p}}</option>{% endfor %}</select></label></div><div id="items"><div class="item grid md:grid-cols-6 gap-3 border-t pt-4"><select name="item_category[]" class="input">{% for c in categories %}<option>{{c}}</option>{% endfor %}</select><input name="item_description[]" placeholder="Description" class="input"><input name="quantity[]" type="number" value="1" min="0.01" step=".01" class="input qty"><input name="unit_price[]" type="number" value="0" min="0" step=".01" class="input price"><input name="discount[]" type="number" value="0" min="0" step=".01" class="input disc"><span class="p-2 font-semibold line">RM 0.00</span></div></div><button type="button" onclick="addItem()" class="mt-4 text-blue-600">+ Add another item</button><label class="block mt-4">Notes<input name="description" class="input" placeholder="Optional transaction note"></label><div class="text-right text-xl font-bold mt-5">Total: <span id="total">RM 0.00</span></div><button class="mt-5 bg-emerald-600 text-white px-5 py-3 rounded">Save {{typ.title()}}</button></form><style>.input{display:block;width:100%;margin-top:4px;padding:9px;border:1px solid #cbd5e1;border-radius:6px}</style><script>document.querySelector('[name=date]').value=new Date().toISOString().slice(0,10);function calc(){let t=0;document.querySelectorAll('.item').forEach(x=>{let v=(+x.querySelector('.qty').value||0)*(+x.querySelector('.price').value||0)-(+x.querySelector('.disc').value||0);x.querySelector('.line').textContent='RM '+v.toFixed(2);t+=v});total.textContent='RM '+t.toFixed(2)}function addItem(){let x=document.querySelector('.item').cloneNode(true);x.querySelectorAll('input').forEach((e,i)=>e.value=i==0?'1':'0');items.append(x);calc()}document.oninput=calc;</script>{% endblock %}
