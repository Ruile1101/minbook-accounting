{% extends 'base.html' %}{% block content %}<h1 class="text-3xl font-bold">Cash & Bank</h1><p class="text-slate-500 mb-6">A simple view of money held in each account.</p><div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">{% for a in accounts %}<div class="bg-white border rounded-xl p-5"><p class="text-slate-500">{{a.name}}</p><p class="text-2xl font-bold">{{a.balance|rm}}</p></div>{% endfor %}</div><form method="post" class="bg-white border rounded-xl p-6 mt-6 max-w-xl"><h2 class="font-semibold mb-3">Transfer money</h2><div class="grid grid-cols-2 gap-3"><select name="from_account" class="border p-2 rounded">{% for a in accounts %}<option>{{a.name}}</option>{% endfor %}</select><select name="to_account" class="border p-2 rounded">{% for a in accounts %}<option>{{a.name}}</option>{% endfor %}</select></div><input class="border p-2 rounded w-full mt-3" type="number" min=".01" step=".01" name="amount" placeholder="Amount" required><button class="mt-3 bg-slate-800 text-white px-4 py-2 rounded">Record transfer</button></form>{% endblock %}
