{% extends 'base.html' %}{% block content %}<h1 class="text-3xl font-bold">Add Expense</h1><p class="text-slate-500 mb-6">Record money paid for your shop.</p><form method="post" class="bg-white border rounded-xl p-6 max-w-xl"><label>Date<input class="input" type="date" name="date" required></label><label>Expense type<select class="input" name="category">{% for c in categories %}<option>{{c}}</option>{% endfor %}</select></label><label>Amount<input class="input" type="number" min=".01" step=".01" name="amount" required placeholder="RM 0.00"></label><label>Paid from<select class="input" name="payment_method">{% for p in payments %}<option>{{p}}</option>{% endfor %}</select></label><label>Description<input class="input" name="description" placeholder="e.g. TNB September"></label><button class="mt-5 bg-red-600 text-white px-5 py-3 rounded">Save Expense</button></form><style>.input{display:block;width:100%;margin:4px 0 14px;padding:9px;border:1px solid #cbd5e1;border-radius:6px}</style><script>document.querySelector('[name=date]').value=new Date().toISOString().slice(0,10)</script>{% endblock %}
