{% extends 'base.html' %}{% block content %}<h1 class="text-3xl font-bold">Settings</h1><p class="text-slate-500 mb-6">Business information and simple tax preferences.</p><form method="post" class="bg-white border rounded-xl p-6 max-w-xl">{% for f,l in [('business_name','Business name'),('address','Address'),('phone','Phone'),('email','Email'),('registration_number','Business registration number')] %}<label>{{l}}<input class="border rounded p-2 w-full mt-1 mb-3" name="{{f}}" value="{{s|attr(f) or ''}}"></label>{% endfor %}<label>SST<select name="sst_status" class="border rounded p-2 w-full mt-1 mb-3"><option {{'selected' if s.sst_status=='Not Registered'}}>Not Registered</option><option {{'selected' if s.sst_status=='Registered'}}>Registered</option></select></label><label><input type="checkbox" name="einvoice_enabled" {{'checked' if s.einvoice_enabled}}> Enable e-Invoice (no MyInvois submission is performed)</label><br><button class="mt-4 bg-slate-800 text-white px-4 py-2 rounded">Save settings</button></form>{% endblock %}
